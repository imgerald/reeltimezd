<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reel Time — Movie Watchlist &amp; Binge Tracker</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <header class="site-header">
      <h1>Reeltimezd</h1>
      <p>Movie watchlist &amp; binge time tracker</p>
    </header>

    <main class="layout">
      <div class="col-main">
        <section id="filter-view" class="toolbar" aria-label="Filters"></section>
        <section id="list-view" aria-label="Watchlist"></section>
      </div>
      <div class="col-side">
        <section id="form-view" class="panel" aria-label="Add or edit a title"></section>
        <section id="stats-view" class="panel" aria-label="Statistics"></section>
      </div>
    </main>

    <noscript><p class="noscript">This app needs JavaScript enabled.</p></noscript>

    <!-- The only script: an ES module. No inline event handlers anywhere. -->
    <script type="module" src="js/controller.js"></script>
  </body>
</html>
